openapi: 3.1.0
info:
  title: RetailSync Middleware API (DS-04)
  version: 1.0.0-draft
  description: |
    REST contract between the POS terminals, Staff App, Admin and Auditor clients,
    the RetailSync Middleware and the HQ demo service.

    Baseline: SRS v1.3, Database Design v1.3, Sprint Backlog v1.4. Sync behaviour is in
    DS-05 (DS-05_Sync_Consistency_Design.md).

    Conventions:
    - All Middleware paths are relative to `/api/v1`. All traffic uses HTTPS with TLS 1.2 or higher.
    - Times are ISO 8601 UTC. Money has two decimals. Field names use snake_case.
    - JWT tokens are pre-issued; there is no login API in Capstone 1.
    - Roles: POS, Staff, Manager, HQ, Admin, Auditor. Each operation names its roles in `x-roles`.
    - A valid token with a role that is not listed gets 403.
    - Staff and Manager tokens are tied to one store; requests for another store get 403.
    - A timestamp without an offset is UTC (never local time). An offset is converted to UTC
      before the value is compared or stored. Stored times have no offset and are UTC.
    - `pos_transaction` keeps two moments: `created_at` (when the Middleware received the
      event) and `occurred_at` (when the POS declared it happened, never overwritten by a
      resend). The Dashboard reads `effective_at = COALESCE(occurred_at, created_at)`, so a
      transaction stored before `occurred_at` existed falls back to its received time. Time
      ranges are half-open `[from, to)`. Dashboard buckets are aligned to the store's
      business day (UTC+7 by default); `/audit-logs` keeps the received time.
    Active discounts (PB-50), shared by `/staff/discounts` and `/pos/discounts`:
    - An active discount is a recommendation with `action_type = DISCOUNT` and `status = ACCEPTED`
      of an active store; `decided_at` comes from its staff decision. With a batch, the batch
      still has stock (`quantity > 0`) and `expiry_date` is today or later (business date,
      UTC+7). Without a batch (SKU level), the business date of `decided_at` is today.
      REJECTED, PENDING, GENERATED, BLOCKED and EXPIRED recommendations never count.
    - `discount_pct` is the value stored at decision time, already after the guardrails; rules
      changed later apply from the next recommendation job, not to accepted discounts.
    - `discounted_price = floor(list_price * (1 - discount_pct / 100) / 100) * 100`, rounded
      down to 100 VND, with `list_price = product.unit_price`. Only the Middleware computes it,
      so the POS and the Staff App show the same number.
    - "Same Middleware" means the same database: every store in it belongs to this Middleware.
      A caller whose own store is inactive gets an empty list.
servers:
  - url: https://middleware.retailsync.local/api/v1
    description: Regional Middleware (reachable only over the private WAN)
tags:
  - name: Health
  - name: POS
  - name: Inventory
  - name: Staff
  - name: Admin
  - name: Audit
  - name: Sync
  - name: HQ demo
  - name: Dashboard
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Service health
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    examples: [ok]

  /pos/events:
    post:
      tags: [POS]
      summary: Receive a SALE, RETURN or CANCELLATION event
      description: |
        PB-05, PB-06, PB-07, PB-09. Target: under 500 ms end to end at p95 (NFR01).
        Checks run in this order: authentication, field validation, original sale lookup for RETURN and CANCELLATION, duplicate check, business rules.
        A CANCELLATION may omit `items`; the Middleware copies them from the original sale.
        Retry with the same `transaction_id` after a timeout or 503.
      operationId: postPosEvent
      x-roles: [POS]
      security:
        - mutualTLS: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosEvent'
            examples:
              sale:
                value:
                  event_type: SALE
                  transaction_id: TXN-DN1-01-000123
                  store_id: STORE-DN1
                  pos_id: POS-DN1-01
                  timestamp: '2026-11-14T03:15:00Z'
                  items:
                    - sku: SKU-0001
                      quantity: 2
                      unit_price: 15000.00
              return:
                value:
                  event_type: RETURN
                  transaction_id: TXN-DN1-01-000124
                  original_transaction_id: TXN-DN1-01-000123
                  store_id: STORE-DN1
                  pos_id: POS-DN1-01
                  timestamp: '2026-11-14T03:40:00Z'
                  items:
                    - sku: SKU-0001
                      quantity: 1
                      unit_price: 15000.00
              cancellation:
                value:
                  event_type: CANCELLATION
                  transaction_id: TXN-DN1-01-000125
                  original_transaction_id: TXN-DN1-01-000123
                  store_id: STORE-DN1
                  pos_id: POS-DN1-01
                  timestamp: '2026-11-14T03:41:00Z'
      responses:
        '200':
          description: Applied (`OK`), or already applied with the same content (`DUPLICATE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosEventResult'
              examples:
                ok:
                  value:
                    outcome: OK
                    code: OK
                    message: Event applied
                    current_stock:
                      SKU-0001: 38
                duplicate:
                  value:
                    outcome: DUPLICATE
                    code: DUPLICATE_IGNORED
                    message: Transaction already recorded
                    current_stock:
                      SKU-0001: 38
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'Original sale not found. Code: ORIGINAL_SALE_NOT_FOUND.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Rejected by a business rule. Codes: CONFLICT (same transaction_id, different content),
            INSUFFICIENT_STOCK, RETURN_QTY_EXCEEDED, SALE_ALREADY_CANCELLED, SALE_HAS_RETURNS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                outcome: REJECTED
                code: INSUFFICIENT_STOCK
                message: Not enough non-expired stock for SKU-0001
        '422':
          description: 'Invalid event. Codes: INVALID_EVENT, UNREGISTERED_STORE_OR_POS. Malformed JSON: VALIDATION_ERROR, answered before authentication.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /pos/discounts:
    get:
      tags: [POS]
      summary: Active discounts of the terminal's store
      description: |
        PB-50. The store is the one of the caller's `pos_terminal` row, never a query parameter
        (a `store_id` parameter is ignored). One entry per SKU: the highest `discount_pct` when
        several discounts are active (batch and SKU level). Read-only, not audited.
        403 `FORBIDDEN` when the token has no `pos_id`, the terminal is unknown or not ACTIVE,
        the client certificate is not the terminal's, or the token's `store_id` is not the
        terminal's store. The POS gateway forwards this path for GET only.
      operationId: getPosDiscounts
      x-roles: [POS]
      security:
        - mutualTLS: []
          bearerAuth: []
      responses:
        '200':
          description: Active discounts, possibly empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosDiscountList'
              example:
                business_date: '2026-11-23'
                items:
                  - sku: SKU-0001
                    discount_pct: 30.0
                    discounted_price: 22400.0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /stores/{store_id}/inventory:
    get:
      tags: [Inventory]
      summary: Current stock of a store
      description: PB-12. Batch and expiry details are included once batches exist (PB-20).
      operationId: getStoreInventory
      x-roles: [Staff, Manager]
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: sku
          in: query
          required: false
          description: Return only this SKU
          schema:
            type: string
            minLength: 1
            maxLength: 20
            pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: Stock lines
          content:
            application/json:
              schema:
                type: object
                required: [store_id, items]
                properties:
                  store_id:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/StockLine'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /products/barcode/{barcode}:
    get:
      tags: [Staff]
      summary: Barcode lookup in the staff member's own store
      description: PB-31.
      operationId: getProductByBarcode
      x-roles: [Staff]
      parameters:
        - name: barcode
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 30
            pattern: '^[A-Za-z0-9-]+$'
      responses:
        '200':
          description: Product with own-store stock and batches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductLookup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /products/barcode/{barcode}/stock:
    get:
      tags: [Staff]
      summary: Cross-store stock, nearest first
      description: |
        PB-35. Read-only, limited to stores of the same Middleware. Target 500 ms.
        An empty `stores` list means no store is available for lookup.
      operationId: getCrossStoreStock
      x-roles: [Staff]
      parameters:
        - $ref: '#/components/parameters/Barcode'
        - name: from_store
          in: query
          required: true
          description: Must be the store of the caller
          schema:
            type: string
            minLength: 1
            maxLength: 10
            pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: Stores ordered from nearest to farthest
          content:
            application/json:
              schema:
                type: object
                required: [sku, stores]
                properties:
                  sku:
                    type: string
                  stores:
                    type: array
                    items:
                      type: object
                      required: [store_id, name, qty, distance_km]
                      properties:
                        store_id:
                          type: string
                        name:
                          type: string
                        qty:
                          type: integer
                          minimum: 0
                        distance_km:
                          type: number
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /near-expiry-alerts:
    get:
      tags: [Staff]
      summary: Open near-expiry alerts of the caller's store
      description: PB-34. EXPIRED alerts first, then fewest days to expiry. days_to_expiry is calculated at read time.
      operationId: listNearExpiryAlerts
      x-roles: [Staff]
      responses:
        '200':
          description: Alerts, possibly empty
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NearExpiryAlert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /recommendations:
    get:
      tags: [Staff]
      summary: PENDING recommendations of the caller's store
      description: PB-32. Only recommendations that passed or were adjusted by the guardrails.
      operationId: listRecommendations
      x-roles: [Staff]
      responses:
        '200':
          description: Recommendations, possibly empty
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecommendationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /recommendations/{rec_id}:
    get:
      tags: [Staff]
      summary: Recommendation details
      description: PB-32.
      operationId: getRecommendation
      x-roles: [Staff]
      parameters:
        - $ref: '#/components/parameters/RecId'
      responses:
        '200':
          description: Details with reason and guardrail results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /recommendations/{rec_id}/decision:
    post:
      tags: [Staff]
      summary: Accept or reject a recommendation
      description: PB-33. A decision is final and is written to audit_log. A recommendation that is no longer valid is refused.
      operationId: decideRecommendation
      x-roles: [Staff]
      parameters:
        - $ref: '#/components/parameters/RecId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [ACCEPT, REJECT]
      responses:
        '200':
          description: Decision stored
          content:
            application/json:
              schema:
                type: object
                required: [rec_id, status, decided_at]
                properties:
                  rec_id:
                    type: integer
                    format: int64
                  status:
                    type: string
                    enum: [ACCEPTED, REJECTED]
                  decided_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Codes: ALREADY_DECIDED, RECOMMENDATION_EXPIRED (for example the batch is sold out).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'


  /staff/forecasts:
    get:
      tags: [Staff]
      summary: Latest forecasts for the caller's store
      description: |
        PB-53-1. Staff and Manager, own store only; query parameters cannot change scope.
        A caller without a store gets 403. Read-only, no audit row.
        One latest forecast per SKU (created_at descending, forecast_id descending on ties).
        SKUs without a forecast are omitted. sellable_stock sums positive quantities of
        batches expiring today or later, on the UTC+7 business date.
        sold_last_7_days sums SALE quantity minus RETURN and CANCELLATION quantity
        for status OK events by effective_at in the seven completed business days:
        [business_date - 7 days at 00:00, business_date at 00:00), converted to UTC.
        Return SHORTAGE, SURPLUS, BALANCED, then sku. Categories remain stored keys.
        Numeric quantities and decimals are JSON numbers, never numeric strings.
      operationId: listStaffForecasts
      x-roles: [Staff, Manager]
      responses:
        '200':
          description: Latest forecasts, possibly empty
          content:
            application/json:
              schema:
                type: object
                required: [business_date, items]
                properties:
                  business_date: {type: string, format: date}
                  items:
                    type: array
                    items:
                      type: object
                      required: [sku, name, category, horizon_days, predicted_demand, sellable_stock,
                        surplus_shortage, balance_status, model_version, created_at, sold_last_7_days]
                      properties:
                        sku: {type: string}
                        name: {type: string}
                        category: {type: string}
                        horizon_days: {type: integer}
                        predicted_demand: {type: number}
                        sellable_stock: {type: integer}
                        surplus_shortage: {type: number}
                        balance_status: {type: string, enum: [SHORTAGE, SURPLUS, BALANCED]}
                        model_version: {type: string}
                        created_at: {type: string, format: date-time}
                        sold_last_7_days: {type: integer}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /staff/discounts:
    get:
      tags: [Staff]
      summary: Active discounts of the caller's store, or of every store
      description: |
        PB-50. `own` lists the caller's store; `all` adds the other active stores of this
        Middleware, own store first, then by distance (haversine, ties by `store_id`). Inside
        a store, items are ordered by `sku`, then `expiry_date`. One item per store, SKU and
        batch: the highest `discount_pct`, then the latest `decided_at`.
        `sold_at_discount` is true when the store has at least one SALE line with status OK for
        the SKU on today's business date, after `decided_at` (sale time is
        `pos_transaction.effective_at`), with `unit_price` below the list price. Read-only,
        not audited. A caller without a store gets 403.
      operationId: listStaffDiscounts
      x-roles: [Staff, Manager]
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [own, all]
            default: own
      responses:
        '200':
          description: Active discounts, possibly empty
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaffDiscount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/stores:
    post:
      tags: [Admin]
      summary: Register a store
      description: PB-08.
      operationId: createStore
      x-roles: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Store'
      responses:
        '201':
          description: Store registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'Code: ALREADY_EXISTS.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/pos-terminals:
    post:
      tags: [Admin]
      summary: Register a POS terminal
      description: PB-08, PB-48.
      operationId: createPosTerminal
      x-roles: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosTerminal'
      responses:
        '201':
          description: Terminal registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosTerminal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Code: ALREADY_EXISTS.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/guardrail-rules:
    get:
      tags: [Admin]
      summary: List guardrail rules
      description: PB-26.
      operationId: listGuardrailRules
      x-roles: [Admin]
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/GuardrailRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/guardrail-rules/{rule_id}:
    put:
      tags: [Admin]
      summary: Change a guardrail rule
      description: PB-26. New values apply from the next validation. The error names the invalid field.
      operationId: updateGuardrailRule
      x-roles: [Admin]
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [threshold, is_active]
              additionalProperties: false
              properties:
                threshold:
                  type: number
                  minimum: 0
                is_active:
                  type: boolean
      responses:
        '200':
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/near-expiry-thresholds:
    get:
      tags: [Admin]
      summary: List near-expiry thresholds per category
      description: PB-21.
      operationId: listNearExpiryThresholds
      x-roles: [Admin]
      responses:
        '200':
          description: Thresholds
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NearExpiryThreshold'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/near-expiry-thresholds/{category}:
    put:
      tags: [Admin]
      summary: Set the threshold of a category
      description: PB-21. Negative or non-integer values are rejected.
      operationId: setNearExpiryThreshold
      x-roles: [Admin]
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
            pattern: '^[A-Za-z0-9_-]+(?: [A-Za-z0-9_-]+)*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [threshold_days]
              properties:
                threshold_days:
                  type: integer
                  minimum: 0
                  maximum: 3650
      responses:
        '200':
          description: Threshold stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearExpiryThreshold'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/jobs/{name}/run:
    post:
      tags: [Admin]
      summary: Run a daily job now
      description: |
        PB-15-6. Runs one job registered with `daily_at` (for example `near-expiry`,
        `forecast`) in the request and answers when it ends. It uses the scheduler's
        per-job lock, so a scheduled run and a requested run never overlap, and it works
        whether or not the scheduler is enabled. Audit `JOB_RUN_REQUESTED` (entity `job`,
        key the job name) is written in its own transaction before the run. Daily jobs are
        safe to run again on the same business date. Sync has its own `POST /sync/run`.
      operationId: runJob
      x-roles: [Admin]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
            pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: The job ran to the end
          content:
            application/json:
              schema:
                type: object
                required: [job, status]
                properties:
                  job:
                    type: string
                  status:
                    type: string
                    enum: [COMPLETED]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'No daily job has this name. Code: NOT_FOUND.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'A run of this job is in progress. Code: JOB_RUNNING.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: 'The job raised an error. Outcome ERROR, code SERVICE_UNAVAILABLE.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /audit-logs:
    get:
      tags: [Audit]
      summary: Query the audit log
      description: |
        PB-04. Read-only. Filters are optional and combined with AND. `from` and `to` are
        inclusive; a value without an offset is UTC. Entries are ordered by `created_at`,
        then `audit_id`, newest first, and `created_at` is returned in UTC with `Z`.
      operationId: listAuditLogs
      x-roles: [Auditor]
      parameters:
        - name: user_id
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: action
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 50
            pattern: '^[A-Za-z0-9_-]+$'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Entries, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /sync/run:
    post:
      tags: [Sync]
      summary: Aggregate and send to HQ now
      description: Runs the hourly cycle on demand, for demos and tests. See DS-05.
      operationId: runSync
      x-roles: [Admin]
      responses:
        '202':
          description: Cycle finished or already running
          content:
            application/json:
              schema:
                type: object
                required: [batches_created, batches_sent, batches_pending]
                properties:
                  batches_created:
                    type: integer
                  batches_sent:
                    type: integer
                  batches_pending:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /hq/snapshot:
    post:
      tags: [Sync]
      summary: HQ snapshot intake (always rejected)
      description: |
        PB-13, NFR05. A full HQ stock snapshot is never applied or converted.
        The attempt is written to audit_log and local stock is unchanged.
        A body over 1 MB is refused with 413 and is not audited.
      operationId: postHqSnapshot
      x-roles: [HQ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any snapshot body; its content is not used.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: |
            The body is over 1 MB. Nothing is applied and nothing is written to audit_log.
            Code: PAYLOAD_TOO_LARGE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Always returned to an authorized caller. Code: SNAPSHOT_REJECTED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sync:
    servers:
      - url: https://hq-demo.retailsync.local/api/v1
        description: HQ demo service (PB-18), own port
    post:
      tags: [HQ demo]
      summary: HQ receives a sync batch
      description: |
        Called by the Middleware with its service JWT, timeout 3 seconds.
        A repeated batch_id with the same content returns ACK and changes no totals.
      operationId: postSyncBatch
      x-roles: [Middleware service]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatchMessage'
      responses:
        '200':
          description: ACK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 'NACK. Code: CONFLICT (same batch_id, different content).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nack'
        '422':
          description: 'NACK. Code: INVALID_BATCH.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nack'
        '503':
          description: HQ offline or error scenario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nack'

  /demo/batches:
    servers:
      - url: https://hq-demo.retailsync.local/api/v1
    get:
      tags: [HQ demo]
      summary: View received batches and totals
      operationId: getDemoBatches
      security: []
      responses:
        '200':
          description: Received data
          content:
            application/json:
              schema:
                type: object
                required: [batches, totals]
                properties:
                  batches:
                    type: array
                    items:
                      type: object
                      required: [batch_id, store_id, txn_count, received_at, duplicate_count]
                      properties:
                        batch_id:
                          type: string
                        store_id:
                          type: string
                        txn_count:
                          type: integer
                        received_at:
                          type: string
                          format: date-time
                        duplicate_count:
                          type: integer
                  totals:
                    type: array
                    items:
                      $ref: '#/components/schemas/SalesLine'

  /demo/mode:
    servers:
      - url: https://hq-demo.retailsync.local/api/v1
    put:
      tags: [HQ demo]
      summary: Switch the demo scenario
      operationId: setDemoMode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [ONLINE, OFFLINE, ERROR, SLOW, DROP_ACK]
                  description: |
                    ONLINE: normal. OFFLINE: connection refused or 503. ERROR: 500.
                    SLOW: answers after the 3 second timeout. DROP_ACK: stores the batch, then fails the answer.
      responses:
        '200':
          description: Mode set

  /dashboard/stores:
    get:
      tags: [Dashboard]
      summary: Stores the caller may read
      description: |
        PB-49 (Dashboard revenue, plan v6). The store list of the caller's scope, for
        the view selector and the comparison selector. Only the caller's role limits
        the answer: no `store_id` is accepted and no `store_id` parameter is
        validated here, so an unknown or out-of-scope store cannot be probed.

        Admin and Auditor see every store in this Middleware. A Manager sees the one
        store of `staff_user`, taken from the database first and then from the token
        claim; a Manager with neither gets 403.

        Unlike the other store listings, this one keeps a store whose `is_active` is
        `0`: an Admin still needs the revenue history of a closed store. That is a
        deliberate exception and does not change the other endpoints.
      operationId: listDashboardStores
      x-roles: [Admin, Auditor, Manager]
      responses:
        '200':
          description: Stores in the caller's scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStoreList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /dashboard/revenue:
    get:
      tags: [Dashboard]
      summary: Revenue over time in one scope
      description: |
        PB-49 (Dashboard revenue, plan v6). Net revenue per bucket, with the total,
        the transaction count, the time-quality counts and the scope that answered.

        Time is the half-open interval **`[from, to)`**: a transaction whose
        `effective_at` equals `to` is not counted, and one equal to `from` is. This
        matches `/audit-logs` on purpose; only the resolution differs.

        `effective_at` is `COALESCE(occurred_at, created_at)`, so a transaction
        stored before `occurred_at` existed falls back to the moment the Middleware
        received it and is approximate.

        Revenue is `SUM(CASE WHEN txn_type = 'SALE' THEN qty * unit_price ELSE
        -qty * unit_price END)` over `transaction_item` with **no** `status`
        filter: a CANCELLATION copies the items of the sale it cancels, so sale and
        cancellation cancel each other out. Filtering `status` here would double
        count.

        `store_id` absent means the whole system (Admin/Auditor) or the caller's
        whole scope (Manager). `include_suspect` defaults to `true`; when it is
        `false` the money and the buckets leave out `SUSPECT_FUTURE` and
        `SUSPECT_OLD`, while `quality` still counts the whole selected interval.

        Money is a JSON number with two decimals.
      operationId: getDashboardRevenue
      x-roles: [Admin, Auditor, Manager]
      parameters:
        - name: store_id
          in: query
          required: false
          description: |
            The view scope. Absent means the whole system for Admin and Auditor, or
            the caller's whole scope for a Manager.
          schema:
            type: string
            minLength: 1
            maxLength: 10
            pattern: '^[A-Za-z0-9_-]+$'
        - name: from
          in: query
          required: true
          description: |
            Start of the half-open interval `[from, to)`. A value without an offset
            is UTC.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: |
            End of the half-open interval `[from, to)`; excluded. A value without an
            offset is UTC.
          schema:
            type: string
            format: date-time
        - name: bucket
          in: query
          required: false
          description: |
            Size of the time buckets. `hour` buckets are aligned to the business
            date of the store, `day`, `week` (ISO) and `month` are aligned to their
            own calendar. Default `day`.
          schema:
            type: string
            enum: [hour, day, week, month]
            default: day
        - name: include_suspect
          in: query
          required: false
          description: |
            `true` (default) counts every transaction; `false` leaves
            `SUSPECT_FUTURE` and `SUSPECT_OLD` out of the money and the points.
            `quality` counts the whole interval either way.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Revenue points, total and quality of the selected interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardRevenue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            `from` later than `to`, an unparsable time, or a `store_id` that does
            not exist. Code `INVALID_STORE` for an unknown store, `VALIDATION_ERROR`
            for a bad field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /dashboard/revenue-by-category:
    get:
      tags: [Dashboard]
      summary: Revenue split by product category in one scope
      description: |
        PB-49 (Dashboard revenue, plan v6). The pie chart: each category's share of
        the net revenue of the view scope, in the half-open interval `[from, to)`.

        A category may be negative, when its returns exceed its sales in the
        interval; it is returned as it is and the caller draws it separately. The
        total is the same revenue the other charts report.

        Categories are the `product.category` values of the catalogue; the UI adds
        the Vietnamese label. An empty or missing category is grouped under `Khác`.

        `store_id` absent means the whole system (Admin/Auditor) or the caller's
        whole scope (Manager). `include_suspect` behaves as on `/dashboard/revenue`.
      operationId: getDashboardRevenueByCategory
      x-roles: [Admin, Auditor, Manager]
      parameters:
        - name: store_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 10
            pattern: '^[A-Za-z0-9_-]+$'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: include_suspect
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Categories, shares, total and quality
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardCategoryRevenue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            `from` later than `to`, or an unknown `store_id`. Code `INVALID_STORE`
            or `VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /dashboard/revenue-by-store:
    get:
      tags: [Dashboard]
      summary: Revenue per store for the comparison chart
      description: |
        PB-49 (Dashboard revenue, plan v6). The bar chart: net revenue per store
        in the half-open interval `[from, to)`, for the stores in the comparison
        set.

        The comparison set is independent of the view scope: the line and pie
        charts read `store_id`, while this one reads `compare_store_ids`. A caller
        may therefore read one store's revenue and still compare a wider set,
        within the caller's own authority.

        `compare_store_ids` repeats its key (`?compare_store_ids=A&compare_store_ids=B`)
        and is never comma separated. Absent or empty means every store in the
        caller's scope. The set can only narrow that scope, never widen it: a
        Manager who names another store gets 403, and an Admin or Auditor who names
        a store that does not exist gets 422 `INVALID_STORE`.

        The set is filtered to the authorized stores before it is queried, so a
        comparison answer never reveals a store outside the caller's scope.

        Money is a JSON number with two decimals.
      operationId: getDashboardRevenueByStore
      x-roles: [Admin, Auditor, Manager]
      parameters:
        - name: compare_store_ids
          in: query
          required: false
          description: |
            Stores to compare, repeated. Absent or empty means every store in the
            caller's scope.
          schema:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 10
              pattern: '^[A-Za-z0-9_-]+$'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: include_suspect
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: One column per store, its share, and the quality
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStoreRevenueResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The caller is not allowed to compare that store, or the caller has no
            store at all. Code `FORBIDDEN`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            `from` later than `to`, or a `compare_store_ids` value that does not
            exist. Code `INVALID_STORE` or `VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    mutualTLS:
      type: mutualTLS
      description: |
        PB-48. POS terminals reach `POST /pos/events` only through the POS gateway on port 9443,
        with TLS 1.2 or 1.3 and a client certificate issued by the RetailSync CA. The gateway
        answers 400 to a connection without a valid certificate and forwards nothing else; the
        TLS handshake itself completes. It forwards the certificate and a shared gateway secret.
        The Middleware answers 403 `FORBIDDEN` when the gateway secret is missing or wrong or no
        certificate was forwarded, before the bearer token is checked, and when the SHA-256 of the
        certificate in DER form (64 lower-case hex characters) differs from
        `pos_terminal.cert_fingerprint` of the event's `pos_id`, or that terminal has none.
        A terminal with no stored fingerprint, such as an unregistered `pos_id`, therefore gets 403
        `FORBIDDEN` at this certificate check, which runs after field validation and before the
        422 `UNREGISTERED_STORE_OR_POS` check.
  parameters:
    StoreId:
      name: store_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 10
        pattern: '^[A-Za-z0-9_-]+$'
    Barcode:
      name: barcode
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 30
        pattern: '^[A-Za-z0-9-]+$'
    RecId:
      name: rec_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9223372036854775807
  responses:
    Unauthorized:
      description: 'Missing, invalid or expired token. Code: UNAUTHORIZED.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Role or store not allowed, or certificate mismatch. Code: FORBIDDEN.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'Resource not found. Code: NOT_FOUND.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: 'Invalid input; `message` names the field. Code: VALIDATION_ERROR.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 'Database error or duplicate check unavailable; nothing was stored. Retry later with the same transaction_id. Code: SERVICE_UNAVAILABLE.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    PosEvent:
      type: object
      required: [event_type, transaction_id, store_id, pos_id, timestamp]
      properties:
        event_type:
          type: string
          enum: [SALE, RETURN, CANCELLATION]
        transaction_id:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[A-Za-z0-9_-]+$'
          description: Idempotency key
        original_transaction_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 40
          pattern: '^[A-Za-z0-9_-]+$'
          description: Required for RETURN and CANCELLATION; a SALE of the same store
        store_id:
          type: string
          minLength: 1
          maxLength: 10
          pattern: '^[A-Za-z0-9_-]+$'
        pos_id:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[A-Za-z0-9_-]+$'
        timestamp:
          type: string
          format: date-time
          description: Time on the POS; not part of the content hash
        items:
          type: array
          maxItems: 100
          description: Required for SALE and RETURN; ignored for CANCELLATION
          items:
            $ref: '#/components/schemas/PosEventItem'
    PosEventItem:
      type: object
      required: [sku, quantity, unit_price]
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[A-Za-z0-9_-]+$'
        quantity:
          type: integer
          exclusiveMinimum: 0
          maximum: 1000000
        unit_price:
          type: number
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
    PosEventResult:
      type: object
      required: [outcome, code, message, current_stock]
      properties:
        outcome:
          type: string
          enum: [OK, DUPLICATE]
        code:
          type: string
          enum: [OK, DUPLICATE_IGNORED]
        message:
          type: string
        current_stock:
          type: object
          description: Current quantity per SKU of the event
          additionalProperties:
            type: integer
    Error:
      type: object
      required: [outcome, code, message]
      properties:
        outcome:
          type: string
          enum: [REJECTED, ERROR]
          description: ERROR means the request may be retried
        code:
          type: string
          description: Stable reason code
        message:
          type: string
    StockLine:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
        quantity:
          type: integer
          minimum: 0
        batches:
          type: array
          items:
            $ref: '#/components/schemas/BatchInfo'
    BatchInfo:
      type: object
      required: [batch_id, expiry_date, quantity]
      properties:
        batch_id:
          type: string
        expiry_date:
          type: string
          format: date
        quantity:
          type: integer
          minimum: 0
    ProductLookup:
      type: object
      required: [sku, barcode, name, category, unit_price, quantity]
      properties:
        sku:
          type: string
        barcode:
          type: string
        name:
          type: string
        category:
          type: string
        unit_price:
          type: number
        quantity:
          type: integer
          minimum: 0
        batches:
          type: array
          items:
            $ref: '#/components/schemas/BatchInfo'
    NearExpiryAlert:
      type: object
      required: [alert_id, batch_id, sku, expiry_date, remaining_qty, days_to_expiry, alert_type]
      properties:
        alert_id:
          type: integer
          format: int64
        batch_id:
          type: string
        sku:
          type: string
        expiry_date:
          type: string
          format: date
        remaining_qty:
          type: integer
        days_to_expiry:
          type: integer
        alert_type:
          type: string
          enum: [NEAR_EXPIRY, EXPIRED]
    RecommendationSummary:
      type: object
      required: [rec_id, sku, action_type, status]
      properties:
        rec_id:
          type: integer
          format: int64
        sku:
          type: string
        action_type:
          type: string
          enum: [DISCOUNT, CLEARANCE, REDISTRIBUTION]
        discount_pct:
          type: [number, 'null']
          description: Only for DISCOUNT
        proposed_qty:
          type: [integer, 'null']
          description: Only for CLEARANCE and REDISTRIBUTION
        status:
          type: string
          enum: [PENDING]
    RecommendationDetail:
      allOf:
        - $ref: '#/components/schemas/RecommendationSummary'
        - type: object
          required: [reason, guardrail_results]
          properties:
            batch_id:
              type: [string, 'null']
            expiry_date:
              type: [string, 'null']
              format: date
            reason:
              type: string
            guardrail_results:
              type: array
              items:
                type: object
                required: [rule_type, outcome]
                properties:
                  rule_type:
                    type: string
                    enum: [MAX_DISCOUNT, MIN_PRICE, MIN_SHELF_LIFE]
                  outcome:
                    type: string
                    enum: [PASSED, ADJUSTED]
                  original_value:
                    type: [number, 'null']
                  adjusted_value:
                    type: [number, 'null']
                  message:
                    type: [string, 'null']
    Store:
      type: object
      required: [store_id, name, latitude, longitude, region_id]
      properties:
        store_id:
          type: string
          minLength: 1
          maxLength: 10
          pattern: '^[A-Za-z0-9_-]+$'
        name:
          type: string
          minLength: 1
          maxLength: 100
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: At most 6 decimal places, as in decimal(9,6).
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: At most 6 decimal places, as in decimal(9,6).
        region_id:
          type: string
          minLength: 1
          maxLength: 10
          pattern: '^[A-Za-z0-9_-]+$'
        is_active:
          type: boolean
          default: true
    PosTerminal:
      type: object
      required: [pos_id, store_id]
      properties:
        pos_id:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[A-Za-z0-9_-]+$'
        store_id:
          type: string
          minLength: 1
          maxLength: 10
          pattern: '^[A-Za-z0-9_-]+$'
        cert_fingerprint:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the client certificate, lower-case hex. Optional until PB-48 issues certificates.
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE
    GuardrailRule:
      type: object
      required: [rule_id, rule_type, threshold, is_active]
      properties:
        rule_id:
          type: integer
        rule_type:
          type: string
          enum: [MAX_DISCOUNT, MIN_PRICE, MIN_SHELF_LIFE]
        threshold:
          type: number
          description: |
            MAX_DISCOUNT is 0 to 100. MIN_PRICE and MIN_SHELF_LIFE are 0 or more.
            At most two decimal places and 12 digits in total; MIN_SHELF_LIFE is a
            whole number of days.
        category:
          type: [string, 'null']
          description: |
            Empty means all categories. When the all-category rule and a category rule
            of the same type are both active, the category rule can only tighten it:
            MAX_DISCOUNT must not be above and MIN_PRICE or MIN_SHELF_LIFE must not be
            below the all-category threshold.
        is_active:
          type: boolean
    NearExpiryThreshold:
      type: object
      required: [category, threshold_days]
      properties:
        category:
          type: string
        threshold_days:
          type: integer
          minimum: 0
          maximum: 3650
    AuditEntry:
      type: object
      required: [audit_id, action, entity_name, created_at]
      properties:
        audit_id:
          type: integer
          format: int64
        user_id:
          type: [integer, 'null']
        action:
          type: string
        entity_name:
          type: string
        entity_key:
          type: [string, 'null']
        details:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    SalesLine:
      type: object
      required: [sku, sold_qty, returned_qty, net_revenue]
      properties:
        sku:
          type: string
        store_id:
          type: string
          description: Present only in HQ totals
        sold_qty:
          type: integer
          minimum: 0
        returned_qty:
          type: integer
          minimum: 0
        net_revenue:
          type: number
    SyncBatchMessage:
      type: object
      required: [batch_id, store_id, created_at, txn_count, lines]
      properties:
        batch_id:
          type: string
          maxLength: 40
          description: sync_batch_id; idempotency key towards HQ
        store_id:
          type: string
        created_at:
          type: string
          format: date-time
        txn_count:
          type: integer
          exclusiveMinimum: 0
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SalesLine'
    Ack:
      type: object
      required: [status, batch_id, duplicate]
      properties:
        status:
          type: string
          enum: [ACK]
        batch_id:
          type: string
        duplicate:
          type: boolean
    Nack:
      type: object
      required: [status, code, message]
      properties:
        status:
          type: string
          enum: [NACK]
        batch_id:
          type: [string, 'null']
        code:
          type: string
        message:
          type: string

    # --- Dashboard (PB-49, plan v6) ---------------------------------------

    DashboardStore:
      type: object
      required: [store_id, name, region_id, is_active]
      properties:
        store_id:
          type: string
          minLength: 1
          maxLength: 10
        name:
          type: string
        region_id:
          type: string
          minLength: 1
          maxLength: 10
        is_active:
          type: boolean
          description: |
            `false` for a closed store. `/dashboard/stores` keeps it, so an Admin
            can still read its history; this is the deliberate exception to the
            other store listings.

    DashboardStoreList:
      type: object
      required: [stores]
      properties:
        stores:
          type: array
          items:
            $ref: '#/components/schemas/DashboardStore'

    DashboardScope:
      type: object
      description: Which scope answered, so the caller can tell the two apart.
      required: [store_id, is_system_wide]
      properties:
        store_id:
          type: [string, 'null']
          description: The view scope, or `null` for the whole system.
        is_system_wide:
          type: boolean
          description: |
            `true` when the answer covers every store in the caller's scope, not a
            single `store_id`.

    DashboardTimePolicy:
      type: object
      description: |
        The two thresholds that decide the labels of `quality`, as the server
        applies them. The console shows these, it never recomputes the labels.
      required: [max_future_skew_seconds, max_backfill_days]
      properties:
        max_future_skew_seconds:
          type: integer
          minimum: 0
          description: Beyond this, a declared moment is `SUSPECT_FUTURE`.
        max_backfill_days:
          type: integer
          minimum: 1
          description: Beyond this, a declared moment is `SUSPECT_OLD`.

    DashboardTimeQuality:
      type: object
      description: |
        Transaction counts of the selected interval, by the declared moment's
        trustworthiness. `unknown` counts the rows stored before `occurred_at`
        existed; the money still uses their `created_at`.
      required: [on_time, backfill, suspect_future, suspect_old, unknown]
      properties:
        on_time:
          type: integer
          minimum: 0
        backfill:
          type: integer
          minimum: 0
        suspect_future:
          type: integer
          minimum: 0
        suspect_old:
          type: integer
          minimum: 0
        unknown:
          type: integer
          minimum: 0

    DashboardBucket:
      type: object
      description: One bucket of the line chart, in the half-open interval `[from, to)`.
      required: [from, to, revenue, transactions]
      properties:
        from:
          type: string
          format: date-time
          description: Bucket start, in UTC.
        to:
          type: string
          format: date-time
          description: |
            Bucket end, in UTC and excluded. Buckets are generated over the
            selected interval, so an empty bucket is still returned with 0.
        revenue:
          type: number
          description: Net revenue, a JSON number with two decimals.
        transactions:
          type: integer
          minimum: 0

    DashboardRevenue:
      type: object
      description: The line chart, the KPI and the badge of the selected interval.
      required: [scope, time_policy, data_from, data_to, has_data, total_revenue,
                 transactions, quality, buckets]
      properties:
        scope:
          $ref: '#/components/schemas/DashboardScope'
        time_policy:
          $ref: '#/components/schemas/DashboardTimePolicy'
        data_from:
          type: [string, 'null']
          format: date-time
          description: |
            Earliest `effective_at` with data in the requested interval, or `null`
            when the interval holds none. It reports the data that exists; the server
            does not clamp the answer to it, so a request reaching past the stored data
            still returns the buckets it asked for, empty beyond this point.
        data_to:
          type: [string, 'null']
          format: date-time
          description: |
            Latest `effective_at` with data in the requested interval, or `null` when
            the interval holds none.
        has_data:
          type: boolean
          description: >
            `false` when the answer contains no transaction, so the console can show
            the empty state and the 0 KPIs. It follows `include_suspect`: an interval
            whose every transaction is suspect has `has_data: false` when the filter
            is on, even though `quality` still counts them.
        total_revenue:
          type: number
          description: |
            Net revenue of the interval, a JSON number with two decimals. It is the
            sum of the buckets and may be negative.
        transactions:
          type: integer
          minimum: 0
          description: |-
            Transactions counted in this answer, so it follows `include_suspect`: with
            `include_suspect=false` the `SUSPECT_FUTURE` and `SUSPECT_OLD` rows are
            excluded while `unknown` rows are kept. `quality` always counts the whole
            interval, so the two differ when the filter is on.
        quality:
          $ref: '#/components/schemas/DashboardTimeQuality'
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/DashboardBucket'

    DashboardCategory:
      type: object
      description: |
        One slice of the pie chart. A negative `revenue` is returned as it is; the
        caller notes it and draws only the positive part.
      required: [category, revenue, share]
      properties:
        category:
          type: string
          description: |
            `product.category`, or `Khác` when the product has none. The UI adds the
            Vietnamese label.
        revenue:
          type: number
          description: Net revenue, a JSON number with two decimals.
        share:
          type: number
          description: |-
            Share of the total revenue: `revenue / total`. Usually between 0 and 1, but
            a category whose net revenue is negative (returns outgrew sales) makes its
            own share negative and pushes the others above 1, so no 0..1 bound is
            applied. The shares still add up to 1.

    DashboardCategoryRevenue:
      type: object
      description: The pie chart, with the total and the time quality.
      required: [scope, time_policy, total_revenue, transactions, quality, categories]
      properties:
        scope:
          $ref: '#/components/schemas/DashboardScope'
        time_policy:
          $ref: '#/components/schemas/DashboardTimePolicy'
        total_revenue:
          type: number
          description: |
            Net revenue of the interval, equal to the sum of the category revenues.
            May be negative.
        transactions:
          type: integer
          minimum: 0
        quality:
          $ref: '#/components/schemas/DashboardTimeQuality'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/DashboardCategory'

    DashboardStoreRevenue:
      type: object
      description: One column of the comparison chart, sorted by revenue descending.
      required: [store_id, name, region_id, revenue, share]
      properties:
        store_id:
          type: string
          minLength: 1
          maxLength: 10
        name:
          type: string
        region_id:
          type: string
        revenue:
          type: number
          description: Net revenue, a JSON number with two decimals.
        share:
          type: number
          description: |-
            Share of the compared set's total revenue: `revenue / total`. Usually
            between 0 and 1, but a store whose net revenue is negative makes its own
            share negative and pushes the others above 1, so no 0..1 bound is applied.
            The shares still add up to 1.

    DashboardStoreRevenueResponse:
      type: object
      description: The bar chart, with the total and the time quality.
      required: [scope, time_policy, data_from, data_to, has_data, total_revenue,
                 transactions, quality, stores]
      properties:
        scope:
          $ref: '#/components/schemas/DashboardScope'
        time_policy:
          $ref: '#/components/schemas/DashboardTimePolicy'
        data_from:
          type: [string, 'null']
          format: date-time
        data_to:
          type: [string, 'null']
          format: date-time
        has_data:
          type: boolean
        total_revenue:
          type: number
          description: |
            Sum of the compared stores, equal to the total the other charts report
            for the same interval.
        transactions:
          type: integer
          minimum: 0
        quality:
          $ref: '#/components/schemas/DashboardTimeQuality'
        stores:
          type: array
          description: |
            One entry per store in the comparison set, a store with no revenue
            included, sorted by revenue descending and then by store id.
          items:
            $ref: '#/components/schemas/DashboardStoreRevenue'

    StaffDiscount:
      type: object
      required: [store_id, store_name, distance_km, sku, name, batch_id, expiry_date,
                 discount_pct, list_price, discounted_price, decided_at, sold_at_discount]
      properties:
        store_id:
          type: string
        store_name:
          type: string
        distance_km:
          type: [number, 'null']
          description: Null for the caller's own store, else rounded to 2 decimals
        sku:
          type: string
        name:
          type: string
        batch_id:
          type: [string, 'null']
          description: Null for a SKU-level discount
        expiry_date:
          type: [string, 'null']
          format: date
        discount_pct:
          type: number
        list_price:
          type: number
        discounted_price:
          type: number
        decided_at:
          type: string
          format: date-time
        sold_at_discount:
          type: boolean
    PosDiscountList:
      type: object
      required: [business_date, items]
      properties:
        business_date:
          type: string
          format: date
        items:
          type: array
          items:
            type: object
            required: [sku, discount_pct, discounted_price]
            properties:
              sku:
                type: string
              discount_pct:
                type: number
              discounted_price:
                type: number
