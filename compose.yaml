name: retailsync

x-sql-image: &sql-image mcr.microsoft.com/mssql/server:2022-latest

services:
  sqlserver:
    image: *sql-image
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-14333}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  migrate:
    image: *sql-image
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      SQLSERVER_HOST: sqlserver
      DB_NAME: ${DB_NAME:-RTS_DB}
      HQ_DB_NAME: ${HQ_DB_NAME:-RTS_HQ}
    volumes:
      - ./database:/workspace/database:ro
    entrypoint: ["/bin/bash", "/workspace/database/migrate.sh"]

  middleware:
    build: ./middleware
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8443", "--ssl-keyfile", "/certs/server.key", "--ssl-certfile", "/certs/server.crt", "--ssl-ciphers", "ECDHE+AESGCM:ECDHE+CHACHA20"]
    env_file: .env
    environment:
      DB_HOST: sqlserver
      SQLSERVER_PORT: 1433
      MTLS_REQUIRED: "true"
      # PB-18: the HQ demo service, reached by its compose service name.
      HQ_URL: https://hq-demo:9000/api/v1
      HQ_CA_FILE: /certs/ca.crt
      HQ_JWT_SECRET: ${HQ_JWT_SECRET:-}
      HQ_TIMEOUT_SECONDS: "3"
      SCHEDULER_ENABLED: "true"
    volumes:
      - ./.certs:/certs:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:8443"

  # The simulated HQ of PB-18: its own FastAPI app, its own database.
  hq-demo:
    build: ./hq-demo
    env_file: .env
    environment:
      DB_HOST: sqlserver
      SQLSERVER_PORT: 1433
      HQ_DB_NAME: ${HQ_DB_NAME:-RTS_HQ}
      HQ_JWT_SECRET: ${HQ_JWT_SECRET:-}
    volumes:
      - ./.certs:/certs:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "127.0.0.1:9000:9000"

  # POS terminals reach the middleware only through this gateway (PB-48).
  # POS_BIND_ADDRESS is the private WAN interface, never a public address.
  pos-gateway:
    image: nginx:1.28.0-alpine
    environment:
      # Empty when unset, so other compose commands keep working; the
      # middleware then refuses every POS event (503) until it is set.
      POS_GATEWAY_SECRET: ${POS_GATEWAY_SECRET:-}
      NGINX_ENVSUBST_FILTER: ^POS_GATEWAY_SECRET$$
    volumes:
      - ./deploy/nginx/pos-gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./.certs:/certs:ro
    depends_on:
      - middleware
    ports:
      - "${POS_BIND_ADDRESS:-127.0.0.1}:9443:9443"

volumes:
  sqlserver_data:
